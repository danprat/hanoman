<style>
  html, body { margin: 0; height: 100%; background: var(--surface-page); }
  #root { height: 100vh; overflow: hidden; }

  /* Primary/danger button text + icon white (buttons only) */
  button { --accent-on: #fff; }

  a { color: var(--text-link); text-decoration: none; }
  a:hover { color: var(--wind-700); text-decoration: underline; }

  /* ---- rendered markdown (Source of Truth preview) ---- */
  .hn-md { color: var(--text-body); font-family: var(--font-sans); font-size: 15px; line-height: 1.72; }
  .hn-md > :first-child { margin-top: 8px; }
  .hn-md h1, .hn-md h2, .hn-md h3, .hn-md h4 {
    font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em;
    color: var(--ink-900); line-height: 1.2; margin: 1.6em 0 0.5em;
  }
  .hn-md h1 { font-size: 30px; margin-top: 0.4em; padding-bottom: 0.34em; border-bottom: 1px solid var(--border-hair); }
  .hn-md h2 { font-size: 22px; }
  .hn-md h3 { font-size: 18px; }
  .hn-md h4 { font-size: 15px; }
  .hn-md p { margin: 0.7em 0; }
  .hn-md ul, .hn-md ol { margin: 0.6em 0; padding-left: 1.5em; }
  .hn-md li { margin: 0.28em 0; }
  .hn-md li::marker { color: var(--brass-500); }
  .hn-md ul.contains-task-list, .hn-md li.task-list-item { list-style: none; }
  .hn-md li.task-list-item { padding-left: 0; }
  .hn-md input[type="checkbox"] { accent-color: var(--brass-500); margin-right: 8px; transform: translateY(1px); }
  .hn-md strong { font-weight: 600; color: var(--ink-900); }
  .hn-md em { color: var(--text-muted); }
  .hn-md a { color: var(--text-link); }
  .hn-md hr { border: none; border-top: 1px solid var(--border-hair); margin: 1.6em 0; }

  .hn-md code {
    font-family: var(--font-mono); font-size: 0.86em;
    background: var(--bone-200); color: var(--ink-800);
    padding: 1.5px 5px; border-radius: var(--radius-xs); border: 1px solid var(--border-hair);
  }
  .hn-md pre {
    background: var(--surface-code); border: 1px solid var(--term-line);
    border-radius: var(--radius-lg); padding: 14px 16px; overflow: auto; margin: 1em 0;
  }
  .hn-md pre code {
    background: transparent; border: none; padding: 0;
    color: var(--term-fg); font-size: 12.5px; line-height: 1.7;
  }
  .hn-md blockquote {
    margin: 1em 0; padding: 4px 16px; border-left: 3px solid var(--brass-500);
    background: var(--brass-050); color: var(--text-body); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .hn-md blockquote p { margin: 0.4em 0; }
  .hn-md table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 14px; }
  .hn-md th {
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); text-align: left; padding: 8px 12px; background: var(--bone-100);
    border: 1px solid var(--border-hair);
  }
  .hn-md td { padding: 8px 12px; border: 1px solid var(--border-hair); color: var(--text-body); }
  .hn-md td code { font-size: 0.82em; }
  .hn-md img { max-width: 100%; border-radius: var(--radius-sm); }

  @keyframes hn-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hn-modal-in { from { opacity: 0; transform: translateY(8px) scale(0.99); } to { opacity: 1; transform: none; } }
  @keyframes hn-toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
