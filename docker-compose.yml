services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hanoman
      POSTGRES_PASSWORD: hanoman
      POSTGRES_DB: hanoman
    ports: ["5432:5432"]
    volumes: ["hanoman_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes: { hanoman_pg: {} }
