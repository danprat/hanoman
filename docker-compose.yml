services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hanoman
      POSTGRES_PASSWORD: hanoman
      POSTGRES_DB: hanoman
    ports: ["5432:5432"]
    volumes: ["hanoman_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanoman"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes: { hanoman_pg: {} }
